name: Expand research artifact

on:
  push:
    branches: [main]
    paths:
      - "artifact/chunk05.b64"
      - "artifact/chunk07.b64"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and expand artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifact/chunk07.b64 ]; then
            echo "Artifact already expanded."
            exit 0
          fi
          cat artifact/chunk*.b64 > artifact.b64
          base64 -d artifact.b64 > artifact.zip
          unzip -o artifact.zip -d .
          rm -f artifact.b64 artifact.zip
          rm -rf artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand reproducibility artifact"
          git push
